name = "Gesso"
uuid = "05f31162-62af-44f0-af37-0e48a49f1899"
version = "0.1.0"
authors = ["Matt <liravossai@gmail.com>"]
license = "Apache-2.0"

[deps]
# Intentionally minimal.
#
# Gesso earns every hard dependency (§VII). The only allowed entries are
# Julia stdlibs, and each one must be added together with an entry in the
# dependency-law test (test/runtests.jl) justifying it:
#   Dates  — timestamps for structured log events (§XLII receipts vocabulary)
#   LinearAlgebra — CPU reference matmul (§LXXV Phase 2)
#   Libdl  — dlopen of libggml for the test-only ggml to_float oracle (GESSO_GGML_DIR)
#   Mmap   — safetensors byte region (§LXXVI)
#   JSON   — config.json + safetensors header parsing (§LXXVI)
#   Sockets — TCP listener for the OpenAI-compatible server (src/serve)
#
# Backend lowering arrives as package extensions when their phases call for
# it — never as core dependencies:
#   Lava    → ext/GessoLavaExt.jl   (Phase 8; the default GPU backend)
#   CUDA.jl → ext/GessoCUDAExt.jl   (Phase 4; optional comparator)
#   AMDGPU.jl + KernelAbstractions → ext/GessoAMDGPUExt.jl (ROCm; GPU-untested)
#
# Lava is vendored at vendor/Lava (upstream plus our patches, see
# vendor/README.md); it is NOT a dependency of this package. Phase 8 (§LXXXI) added it as a WEAKDEP + extension only.
Dates = "ade2ca70-3891-5945-98fb-dc099432e06a"
# Phase 2 (§LXXV): CPU reference matmul — matmul! lowers x * transpose(W)
# through BLAS. Stdlib, justified in the dependency-law test.
LinearAlgebra = "37e2e46d-f89d-539d-b4ee-838fcccc9c8e"
# GGUF: dlopen llama.cpp ggml for the test-only to_float oracle. Runtime dequant is native.
Libdl = "8f399da3-3557-5675-b5ff-fb832c97cbdb"
# Phase 3 (§LXXVI): safetensors byte region is mmapped, never copied
# through a handle. Stdlib, justified in the dependency-law test.
Mmap = "a63ad114-7e13-5084-954f-fe012c677804"
# Phase 3 (§LXXVI): the ONE sanctioned third-party dependency — config.json
# and the safetensors header are JSON. Justified in the dependency-law test.
JSON = "682c06a0-de6a-54ab-a142-c8b1cf79cde6"
# Serve (src/serve): the OpenAI-compatible chat server listens on TCP. HTTP/1.1
# framing is hand-written, so Sockets is the only network dependency. Stdlib,
# justified in the dependency-law test.
Sockets = "6462fe0b-24de-5631-8697-dd941f90decc"

[weakdeps]
# Phase 4 (§LXXVII): CUDA.jl is a package EXTENSION, never a core dep (§VII).
# ext/GessoCUDAExt.jl is the only file allowed to `using CUDA`; core compiles
# and tests with CUDA not loaded.
CUDA = "052768ef-5323-5732-b1bb-66c8b64840ba"
# Phase 8 (§LXXXI): Lava (Vulkan) is a package EXTENSION, never a core dep.
# ext/GessoLavaExt.jl is the only file allowed to `using Lava`; core compiles
# and tests with Lava not loaded. Not in the General registry — the test env
# loads vendor/Lava via [sources] (test/Project.toml).
Lava = "3a680b1f-cb25-4bee-9cf7-bc880b76dc8c"
# AMDGPU.jl (ROCm) is a package EXTENSION, never a core dep. The extension
# needs KernelAbstractions too: AMDGPU 2.10 carries it only as a weakdep, so
# both trigger GessoAMDGPUExt (`using AMDGPU, KernelAbstractions, Gesso`).
AMDGPU = "21141c5a-9bdb-4563-92ae-f87d6854732e"
KernelAbstractions = "63c18a36-062a-441e-b654-da1e3ab1ce7c"

[extensions]
GessoCUDAExt = "CUDA"
GessoLavaExt = "Lava"
GessoAMDGPUExt = ["AMDGPU", "KernelAbstractions"]

[compat]
AMDGPU = "2.8"
KernelAbstractions = "0.9.43, 0.10"
julia = "1.12"

[extras]
# Intentionally empty. Test/benchmark dependencies live in the workspace
# members (test/Project.toml, benchmark/Project.toml).

[workspace]
projects = ["test", "benchmark"]
