[deps]
Gesso = "05f31162-62af-44f0-af37-0e48a49f1899"
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"
# stdlib: receipt timestamp assertions (the package itself depends on Dates
# for the same reason; this is the test env, not the core package)
Dates = "ade2ca70-3891-5945-98fb-dc099432e06a"
# stdlib: deterministic fixtures (test/testhelpers.jl). Julia 1.12 stdlibs
# are packages: they must be DECLARED here to be loadable — direct runs
# resolve Random through the workspace manifest (BenchmarkTools dep), but
# Pkg.test's sandbox env exposes only declared deps.
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"
# stdlib: toy fixture pack is described as DATA in TOML files
# (test/fixtures/toy/) — parsed by the loader in test/toyfixtures.jl
TOML = "fa267f1f-6049-4f14-aa54-33bafae1ed76"
# stdlib: the llama_micro fixture writer produces safetensors-layout files;
# the core reader mmaps the byte region (same lesson as Random: declare it)
Mmap = "a63ad114-7e13-5084-954f-fe012c677804"
# Phase 3 (§LXXVI): the core package declares JSON for config/header
# parsing; the test sandbox needs it declared too (it is not a stdlib, so
# the sandbox rule bites even harder)
JSON = "682c06a0-de6a-54ab-a142-c8b1cf79cde6"
# Phase 4 (§LXXVII): CUDA in the TEST env so Pkg.test can load the
# GessoCUDAExt extension. This is the test env, not core — core [deps]
# stays CUDA-free (§VII). Device-absent machines still pass: the CUDA
# tests are named skips when CUDA.functional() is false.
CUDA = "052768ef-5323-5732-b1bb-66c8b64840ba"

[sources]
Gesso = {path = ".."}
